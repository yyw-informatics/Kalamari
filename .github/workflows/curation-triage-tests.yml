# Unit tests + the pin update gate for the curation-triage add-on.
#
# This is a normal, blocking CI gate — unlike curation-triage.yml, which is the
# monthly triage job and is deliberately kept out of required status checks.
# Both jobs run offline: every network call is behind an injectable fetcher backed
# by a committed cache, and the update gate executes no tool and fetches nothing.

name: curation-triage tests

on:
  push:
    # This list is duplicated below for pull_request. GitHub has no anchor/alias
    # support in workflow triggers, so the two copies MUST be edited together.
    paths:
      - 'bin/curation-triage/**'
      - 'src/curation-triage/**'
      # The pinning artifacts are already inside the two globs above. They are named
      # anyway so it is visible at the trigger that changing a pin runs the gate:
      # these four files ARE the pin state the gate checks.
      - 'src/curation-triage/envs/**'
      - 'src/curation-triage/tool_pins.tsv'
      - 'src/curation-triage/pin_changelog.tsv'
      - 'bin/curation-triage/update_gate.py'
      - 'pyproject.toml'
      # All three fork-owned workflows are listed, not just this one: a change to the
      # monthly run or to the refresh workflow can break either of them, and it must
      # not be possible to land that change with nothing turning red.
      - '.github/workflows/curation-triage-tests.yml'
      - '.github/workflows/curation-triage.yml'
      - '.github/workflows/curation-triage-refresh.yml'
  pull_request:
    # Keep in sync with the push list above.
    paths:
      - 'bin/curation-triage/**'
      - 'src/curation-triage/**'
      - 'src/curation-triage/envs/**'
      - 'src/curation-triage/tool_pins.tsv'
      - 'src/curation-triage/pin_changelog.tsv'
      - 'bin/curation-triage/update_gate.py'
      - 'pyproject.toml'
      - '.github/workflows/curation-triage-tests.yml'
      - '.github/workflows/curation-triage.yml'
      - '.github/workflows/curation-triage-refresh.yml'
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the suite is developed against; 3.11 matches the
        # monthly triage job in curation-triage.yml.
        python-version: ['3.10', '3.11', '3.12']
    name: pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pytest
        run: python -m pip install --upgrade pip pytest
      # testpaths/rootdir come from pyproject.toml, so a bare pytest is enough.
      - name: run the suite (offline)
        run: python -m pytest

  # The four-point gate a pin change has to pass: (1) every pinned artifact still
  # hashes to its recorded digest, (2) the Tier-2 validation panel replays to the same
  # calls AND was produced by the pinned tools (the caches' own recorded versions must
  # match tool_pins.tsv), (3) every call that moved is attributable to software,
  # database, threshold, rule or a recorded panel-scope change -- never
  # "unattributable", and (4) a moved pin has a row in
  # src/curation-triage/pin_changelog.tsv.
  #
  # The panel's SCOPE is frozen in update_gate.py as PANEL_SCOPE and must never be read
  # from the ledger. Taking it from the ledger's trigger set means an SME resolving a
  # Tier-1 lead shrinks the panel, moves its digest and fails point 2 with no legal
  # changelog row to add -- ordinary curation breaking the gate. Changing the scope is
  # a `panel:scope` changelog row, i.e. a recorded decision.
  #
  # Its own job, not a pytest case, because it answers a different question: pytest
  # asks "does the code still behave", the gate asks "did the PINNED WORLD move, and
  # if so is the move recorded". A red gate on a green pytest is a meaningful signal
  # and it should be readable straight off the checks list.
  #
  # One Python version is enough: --check reads committed tables and replays committed
  # evidence with the standard library. It installs no tool, runs no tool, and touches
  # no network, so the interpreter matrix has nothing to add.
  update-gate:
    runs-on: ubuntu-24.04
    name: pin update gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The exit code IS the verdict; a failure prints the exact pin_changelog.tsv row
      # to add and the commands that produce its numbers.
      - name: four-point update gate (offline, no tools)
        run: python bin/curation-triage/update_gate.py --check
